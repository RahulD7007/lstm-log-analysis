name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build, Run Pipeline, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          # Install as editable package for absolute module imports
          python -m pip install --no-build-isolation -e . --no-deps
          # Install testing and linting tools
          python -m pip install pytest flake8

      - name: Lint Code (Flake8)
        run: |
          python -m flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Lint warnings found, continuing..."
        continue-on-error: true

      # --- START ML PIPELINE EXECUTIONS ---
      
      - name: 1. Data Ingestion & Log Parsing
        # Reduced session count for fast CI execution
        run: python -m src.dataset --download-or-generate --num-sessions 500

      - name: 2. Feature Extraction & Windowing
        run: python -m src.features --window-size 10 --train-split 0.8

      - name: 3. Train DeepLog LSTM Model
        # Reduced epochs/units so CI finishes quickly
        run: python -m src.modeling.train --epochs 2 --batch-size 32 --lr 0.001 --lstm-units 32

      - name: 4. Run Predictions & Production Evaluation
        run: python -m src.modeling.predict --top-k 9

      - name: 5. Visualizations & Metrics Generation
        run: |
          if [ -f src/plots.py ]; then
            python -m src.plots || echo "Plotting skipped or failed, continuing..."
          else
            echo "src/plots.py not found, skipping."
          fi
        continue-on-error: true

      # --- END ML PIPELINE ---

      - name: 6. Run Automated Test Suite
        run: pytest tests/ src/test_scripts/ -v


  docker-build:
    name: Build and Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only push to DockerHub on direct push/merge to main or master
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check if Dockerfile exists
        id: check_docker
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No Dockerfile found, skipping Docker build."
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: steps.check_docker.outputs.exists == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lstm-log-analysis:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lstm-log-analysis:${{ github.sha }}
